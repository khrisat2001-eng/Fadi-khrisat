<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Trader</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Crypto Trader</h1>
    <span class="mode-badge paper">PRACTICE MONEY · real-money trading locked</span>
  </header>

  <main>
    <section id="login-view" hidden>
      <div class="panel narrow">
        <h2>Sign in</h2>
        <p>Enter the app access token set on the server.</p>
        <form id="login-form" autocomplete="off">
          <input type="password" id="login-token" required aria-label="Access token" autocomplete="off">
          <button type="submit">Sign in</button>
          <p class="error" id="login-error"></p>
        </form>
      </div>
    </section>

    <section id="portal-view" hidden>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button data-tab="trade">Trade</button>
        <button data-tab="home">Overview</button>
        <button data-tab="news">News</button>
        <button data-tab="exchanges">Exchanges</button>
        <button data-tab="risk">Safety settings</button>
        <button data-tab="trading">Advanced</button>
      </nav>
      <div data-pane="trade" hidden><div id="trade"></div></div>
      <div data-pane="home" hidden><div id="home"></div><div id="alerts"></div></div>
      <div data-pane="trading" hidden><div id="paper"></div></div>
      <div data-pane="news" hidden><div id="news"></div></div>
      <div data-pane="exchanges" hidden><div id="cards" class="cards"></div></div>
      <div data-pane="risk" hidden><div id="risk"></div></div>
    </section>

    <section id="wizard-view" hidden>
      <div class="panel">
        <button class="link" id="wizard-back">← Back to connections</button>
        <ol class="stepper" id="stepper"></ol>
        <div id="wizard-body"></div>
      </div>
    </section>
  </main>

  <template id="tpl-step-labels">
    <li>Choose exchange</li><li>Create API key</li><li>Permissions</li><li>Enter key</li><li>Validate</li>
    <li>Balances</li><li>Status</li><li>Allocation &amp; pairs</li><li>Paper trading</li><li>Live trading</li>
  </template>

  <script src="/static/app.js"></script>
  <script src="/static/news.js"></script>
  <script src="/static/home.js"></script>
  <script src="/static/trade.js"></script>
</body>
</html>
